      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.92  0 0.58 0 0 0.45  0 0 1 0 1  0 0 0 0.94 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="thinGlow" x="-25%" y="-35%" width="150%" height="170%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

