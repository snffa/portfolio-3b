      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-38%" y="-38%" width="176%" height="176%" color-interpolation-filters="sRGB">
